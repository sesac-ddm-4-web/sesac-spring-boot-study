<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Hub</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="header">
  <div class="header__inner">
    <button class="brand" data-nav="studies"><span class="brand__mark">S</span>Study Hub</button>
    <nav class="nav">
      <button class="nav__item" data-nav="studies">스터디 찾기</button>
      <button class="nav__item" data-nav="my">내 스터디</button>
      <button class="nav__item" data-nav="profile">내 프로필</button>
    </nav>
    <div class="user" id="userBox"></div>
  </div>
</header>

<main class="main">
  <!-- 로그인 / 회원가입 -->
  <section class="view" data-view="auth" hidden>
    <div class="auth-hero">
      <h1>함께 공부할 사람을 찾아보세요</h1>
      <p class="muted">로그인하면 스터디를 만들고 참여하고 일정을 관리할 수 있어요.</p>
    </div>
    <div class="auth-grid">
      <form id="loginForm" class="card form-card">
        <h2>로그인</h2>
        <label>이메일<input name="email" type="text" placeholder="you@example.com" autocomplete="username"></label>
        <label>비밀번호<input name="password" type="password" autocomplete="current-password"></label>
        <button class="btn btn--primary" type="submit">로그인</button>
      </form>
      <form id="signupForm" class="card form-card">
        <h2>회원가입</h2>
        <label>이메일<input name="email" type="text" placeholder="you@example.com" autocomplete="username"></label>
        <label>비밀번호<input name="password" type="password" placeholder="8~20자" autocomplete="new-password"></label>
        <label>이름<input name="name" type="text" placeholder="30자 이하"></label>
        <button class="btn btn--ghost" type="submit">가입하고 시작하기</button>
      </form>
    </div>
  </section>

  <!-- 스터디 목록 -->
  <section class="view" data-view="studies" hidden>
    <div class="page-head">
      <div>
        <h1>스터디 찾기</h1>
        <p class="muted">함께 공부할 스터디를 찾거나 직접 만들어 보세요.</p>
      </div>
      <button class="btn btn--primary" id="toggleCreate">+ 스터디 만들기</button>
    </div>

    <form id="createForm" class="card form-card" hidden>
      <h2>새 스터디</h2>
      <label>스터디 이름<input name="name" type="text" placeholder="예: Spring JPA 스터디"></label>
      <label>소개<textarea name="description" rows="3" placeholder="어떤 스터디인지 소개해 주세요."></textarea></label>
      <label>정원 (2~50명, 스터디장 포함)<input name="capacity" type="number" placeholder="5"></label>
      <button class="btn btn--primary" type="submit">만들기</button>
    </form>

    <div class="segmented" id="statusFilter">
      <button class="is-active" data-status="">전체</button>
      <button data-status="RECRUITING">모집중</button>
      <button data-status="CLOSED">마감</button>
    </div>
    <div class="grid" id="studyGrid"></div>
    <div class="pager">
      <button class="btn btn--ghost" id="prevPage">이전</button>
      <span id="pageInfo" class="muted"></span>
      <button class="btn btn--ghost" id="nextPage">다음</button>
    </div>
  </section>

  <!-- 스터디 상세 -->
  <section class="view" data-view="detail" hidden>
    <button class="back" data-action="back">← 뒤로</button>
    <div id="detail"></div>
  </section>

  <!-- 내 스터디 -->
  <section class="view" data-view="my" hidden>
    <div class="page-head">
      <div>
        <h1>내 스터디</h1>
        <p class="muted">참여 중인 스터디예요. 최근 참여한 순서로 보여요.</p>
      </div>
    </div>
    <div class="grid" id="myGrid"></div>
  </section>

  <!-- 내 프로필 -->
  <section class="view" data-view="profile" hidden>
    <div id="profile"></div>
  </section>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="/js/app.js"></script>
</body>
</html>
