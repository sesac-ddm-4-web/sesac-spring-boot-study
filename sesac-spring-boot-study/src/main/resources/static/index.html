<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 위시리스트 · 예산 추천</title>
    <style>
        :root {
            --bg: #e5e7eb;
            --card: #ffffff;
            --text: #4a3f5c;
            --muted: #8a7da0;
            --line: rgba(160, 140, 190, 0.28);
            --primary: #b07cc6;
            --primary-dark: #9560ad;
            --accent: #f28fae;
            --danger: #d4506f;
            --ok: #5a9e86;
            --sample: #e8a23a;
        }
        * { box-sizing: border-box; }
        html { min-height: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            color: var(--text);
            background: var(--bg);
        }
        header {
            background: var(--card);
            border-bottom: 1px solid var(--line);
            padding: 16px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        header h1 { margin: 0; font-size: 20px; letter-spacing: -0.3px; }
        .mode { display: flex; align-items: center; gap: 12px; font-size: 14px; flex-wrap: wrap; }
        .badge {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }
        .badge.sample { background: var(--sample); }
        .badge.live { background: var(--ok); }
        main {
            max-width: 960px;
            margin: 24px auto;
            padding: 0 16px 40px;
            display: grid;
            gap: 20px;
            grid-template-columns: 1fr 1fr;
        }
        @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
        section {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 6px 24px rgba(150, 110, 180, 0.12);
        }
        section.full { grid-column: 1 / -1; }
        h2 { margin: 0 0 14px; font-size: 16px; }
        .notice {
            display: none;
            background: rgba(255, 244, 222, 0.85);
            border: 1px solid #f3d49a;
            color: #8a5a00;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 12px;
        }
        body.sample .notice { display: block; }
        label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.85);
            color: var(--text);
        }
        input:focus { outline: 2px solid var(--primary); border-color: transparent; }
        button {
            margin-top: 14px;
            padding: 10px 16px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { filter: brightness(0.95); }
        button:disabled { opacity: 0.6; cursor: default; }
        button.ghost {
            background: transparent;
            color: var(--primary-dark);
            border: 1px solid var(--primary);
            margin-top: 0;
            padding: 6px 12px;
        }
        .msg { margin-top: 10px; font-size: 13px; min-height: 18px; }
        .msg.error { color: var(--danger); }
        .msg.ok { color: var(--ok); }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
        th { color: var(--muted); font-weight: 600; font-size: 13px; }
        td.num, th.num { text-align: right; }
        .empty { color: var(--muted); font-size: 14px; padding: 12px 0; }
        .free {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 7px;
            border-radius: 999px;
            font-size: 11px;
            color: #fff;
            background: var(--ok);
        }
        .rank {
            display: inline-block;
            width: 22px; height: 22px;
            line-height: 22px;
            text-align: center;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            font-size: 12px;
            margin-right: 8px;
        }
        .list-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        .list-head h2 { margin: 0; }
        .list-actions { display: flex; gap: 8px; }
        pre {
            background: #3b3252;
            color: #e7def5;
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            overflow: auto;
            max-height: 220px;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-title { font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
    </style>
</head>
<body class="live">

<header>
    <h1>🎮 게임 위시리스트 · 예산 추천</h1>
    <div class="mode">
        <span id="modeBadge" class="badge live">API 연동</span>
        <label style="margin:0; display:flex; align-items:center; gap:6px; cursor:pointer; color:inherit;">
            <input type="checkbox" id="sampleToggle"> 샘플 데이터로 보기
        </label>
    </div>
</header>

<main>
    <!-- 1. 등록 폼 -->
    <section>
        <h2>위시리스트에 게임 추가</h2>
        <div class="notice">⚠ 샘플 화면입니다. 입력한 내용은 서버에 저장되지 않고 브라우저 메모리에만 남습니다.</div>
        <form id="registerForm">
            <label for="name">게임 이름</label>
            <input type="text" id="name" placeholder="예: 데이브 더 다이버">
            <label for="price">가격 (원)</label>
            <input type="number" id="price" placeholder="예: 24000" step="1">
            <button type="submit">추가</button>
        </form>
        <div id="registerMsg" class="msg"></div>
    </section>

    <!-- 2. 예산 입력 + 4. 추천 결과 -->
    <section>
        <h2>예산으로 구매 후보 추천</h2>
        <div class="notice">⚠ 샘플 화면입니다. 추천 결과는 브라우저에서 계산한 예시입니다.</div>
        <form id="recommendForm">
            <label for="budget">예산 (원)</label>
            <input type="number" id="budget" placeholder="예: 11000" step="1">
            <button type="submit">추천 받기</button>
        </form>
        <div id="recommendMsg" class="msg"></div>
        <div id="recommendResult"></div>
    </section>

    <!-- 3. 전체 목록 -->
    <section class="full">
        <div class="notice">⚠ 샘플 화면입니다. 아래 목록은 예시 데이터입니다.</div>
        <div class="list-head">
            <h2>전체 위시리스트</h2>
            <div class="list-actions">
                <button type="button" id="seedBtn" class="ghost">예시 게임 5개 서버에 등록</button>
                <button type="button" id="reloadBtn" class="ghost">새로고침</button>
            </div>
        </div>
        <div id="listMsg" class="msg"></div>
        <div id="listArea"></div>
    </section>

    <!-- 요청/응답 확인 -->
    <section class="full" id="logSection">
        <h2>요청 · 응답 확인</h2>
        <div class="log-title">마지막 요청</div>
        <pre id="logRequest">(아직 없음)</pre>
        <div class="log-title">마지막 응답</div>
        <pre id="logResponse">(아직 없음)</pre>
    </section>
</main>

<script>
    // ───────── 상태 ─────────
    let useSample = false;

    // 예시 게임 데이터 (샘플 모드 + "예시 게임 등록" 버튼에서 사용)
    const SEED_GAMES = [
        { name: "데이브 더 다이버", price: 24000 },
        { name: "Lethal Company", price: 11000 },
        { name: "R.E.P.O", price: 10700 },
        { name: "산나비", price: 15500 },
        { name: "No Results Found", price: 0 }
    ];

    let sampleProducts = SEED_GAMES.map((g, i) => ({ id: i + 1, name: g.name, price: g.price }));
    let sampleNextId = SEED_GAMES.length + 1;

    // ───────── DOM ─────────
    const $ = (id) => document.getElementById(id);
    const nameInput = $("name");
    const priceInput = $("price");
    const budgetInput = $("budget");

    // ───────── 유틸 ─────────
    function formatWon(n) {
        return Number(n).toLocaleString("ko-KR") + "원";
    }

    function setMsg(el, text, type) {
        el.textContent = text || "";
        el.className = "msg" + (type ? " " + type : "");
    }

    function showLog(req, res) {
        $("logRequest").textContent = req;
        $("logResponse").textContent = res;
    }

    // API 호출 공통 함수: 요청/응답을 화면에 기록하고, 실패 시 서버 메시지로 예외를 던진다.
    async function callApi(method, url, body) {
        const options = { method, headers: {} };
        let reqText = method + " " + url;
        if (body !== undefined) {
            options.headers["Content-Type"] = "application/json";
            options.body = JSON.stringify(body);
            reqText += "\nContent-Type: application/json\n\n" + options.body;
        }

        let res;
        try {
            res = await fetch(url, options);
        } catch (e) {
            showLog(reqText, "네트워크 오류: " + e.message);
            throw new Error("서버에 연결할 수 없습니다.");
        }

        const text = await res.text();
        showLog(reqText, "HTTP " + res.status + "\n\n" + text);

        if (!res.ok) {
            throw new Error(text || ("요청 실패 (HTTP " + res.status + ")"));
        }
        return text ? JSON.parse(text) : null;
    }

    // ───────── 렌더링 ─────────
    function renderTable(products, withRank) {
        if (!products || products.length === 0) return null;
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const hr = document.createElement("tr");
        [withRank ? "순위" : "ID", "게임", "가격"].forEach((t, i) => {
            const th = document.createElement("th");
            th.textContent = t;
            if (i === 2) th.className = "num";
            hr.appendChild(th);
        });
        thead.appendChild(hr);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        products.forEach((p, idx) => {
            const tr = document.createElement("tr");

            const td1 = document.createElement("td");
            if (withRank) {
                const r = document.createElement("span");
                r.className = "rank";
                r.textContent = idx + 1;
                td1.appendChild(r);
            } else {
                td1.textContent = p.id;
            }

            const td2 = document.createElement("td");
            td2.textContent = p.name;

            const td3 = document.createElement("td");
            td3.className = "num";
            td3.textContent = formatWon(p.price);
            if (p.price === 0) {
                const f = document.createElement("span");
                f.className = "free";
                f.textContent = "무료";
                td3.appendChild(f);
            }

            tr.append(td1, td2, td3);
            tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        return table;
    }

    function renderList(products) {
        const area = $("listArea");
        area.innerHTML = "";
        const table = renderTable(products, false);
        if (table) {
            area.appendChild(table);
        } else {
            const d = document.createElement("div");
            d.className = "empty";
            d.textContent = "위시리스트가 비어 있습니다.";
            area.appendChild(d);
        }
    }

    function renderRecommend(products) {
        const area = $("recommendResult");
        area.innerHTML = "";
        const table = renderTable(products, true);
        if (table) {
            area.appendChild(table);
        } else {
            const d = document.createElement("div");
            d.className = "empty";
            d.textContent = "예산 이하의 구매 후보가 없습니다.";
            area.appendChild(d);
        }
    }

    // ───────── 데이터 접근 (샘플 / API 분기) ─────────
    async function fetchAll() {
        if (useSample) return sampleProducts.slice();
        return callApi("GET", "/products");
    }

    async function createProduct(name, price) {
        if (useSample) {
            if (!name.trim()) throw new Error("이름은 비어 있을 수 없습니다.");
            if (price < 0) throw new Error("가격은 0 이상의 정수여야 합니다.");
            const p = { id: sampleNextId++, name: name.trim(), price };
            sampleProducts.push(p);
            return p;
        }
        return callApi("POST", "/products", { name, price });
    }

    async function fetchRecommend(budget) {
        if (useSample) {
            if (budget < 0) throw new Error("예산은 0 이상이어야 합니다.");
            return sampleProducts
                .filter((p) => p.price <= budget)
                .sort((a, b) => a.price - b.price) // 안정 정렬: 같은 가격은 등록 순서 유지
                .slice(0, 3);
        }
        return callApi("GET", "/recommend/" + encodeURIComponent(budget));
    }

    // ───────── 화면 동작 ─────────
    async function loadList() {
        setMsg($("listMsg"), "");
        try {
            renderList(await fetchAll());
        } catch (e) {
            $("listArea").innerHTML = "";
            setMsg($("listMsg"), e.message, "error");
        }
    }

    $("registerForm").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const priceRaw = priceInput.value.trim();
        if (priceRaw === "") {
            setMsg($("registerMsg"), "가격을 입력해 주세요.", "error");
            return;
        }
        // 입력 검증은 서버가 하도록 그대로 보낸다 (서버 응답 확인용)
        try {
            const p = await createProduct(nameInput.value, Number(priceRaw));
            setMsg($("registerMsg"), "추가 완료: " + p.name + " (" + formatWon(p.price) + ")", "ok");
            nameInput.value = "";
            priceInput.value = "";
            loadList();
        } catch (e) {
            setMsg($("registerMsg"), e.message, "error");
        }
    });

    $("recommendForm").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const raw = budgetInput.value.trim();
        if (raw === "") {
            setMsg($("recommendMsg"), "예산을 입력해 주세요.", "error");
            return;
        }
        setMsg($("recommendMsg"), "");
        try {
            renderRecommend(await fetchRecommend(Number(raw)));
        } catch (e) {
            $("recommendResult").innerHTML = "";
            setMsg($("recommendMsg"), e.message, "error");
        }
    });

    $("reloadBtn").addEventListener("click", loadList);

    // 예시 게임 5개를 실제 서버에 순서대로 등록 (API 모드 전용)
    $("seedBtn").addEventListener("click", async () => {
        if (useSample) {
            setMsg($("listMsg"), "샘플 모드에서는 이미 예시 데이터가 들어 있습니다.", "error");
            return;
        }
        const btn = $("seedBtn");
        btn.disabled = true;
        try {
            for (const g of SEED_GAMES) {
                await callApi("POST", "/products", g);
            }
            setMsg($("listMsg"), "예시 게임 " + SEED_GAMES.length + "개를 서버에 등록했습니다.", "ok");
            const all = await fetchAll();
            renderList(all);
        } catch (e) {
            setMsg($("listMsg"), e.message, "error");
        } finally {
            btn.disabled = false;
        }
    });

    $("sampleToggle").addEventListener("change", (ev) => {
        useSample = ev.target.checked;
        document.body.className = useSample ? "sample" : "live";
        const badge = $("modeBadge");
        badge.className = "badge " + (useSample ? "sample" : "live");
        badge.textContent = useSample ? "샘플 데이터" : "API 연동";
        $("logSection").style.display = useSample ? "none" : "";
        $("seedBtn").style.display = useSample ? "none" : "";
        $("recommendResult").innerHTML = "";
        setMsg($("registerMsg"), "");
        setMsg($("recommendMsg"), "");
        loadList();
    });

    // 최초 로드
    loadList();
</script>
</body>
</html>
